spring.application.name=acs-oop-extension

# --- Event API: conexion al broker ActiveMQ que usa Alfresco ---
spring.activemq.broker-url=tcp://localhost:61616
# ACS 26.2 trae ActiveMQ 6 con autenticacion obligatoria (ACTIVEMQ_ADMIN_LOGIN / ACTIVEMQ_ADMIN_PASSWORD)
spring.activemq.user=admin
spring.activemq.password=admin
# Necesario para que Spring Boot cree el ActiveMQConnectionFactory que espera el SDK
spring.jms.cache.enabled=false
# Topic donde el repositorio publica los eventos (valor por defecto)
alfresco.events.topic-name=alfresco.repo.event2
alfresco.events.enable-handlers=true
alfresco.events.enable-spring-integration=true

# --- REST API: conexion al repositorio ---
content.service.url=http://localhost:8080
content.service.path=/alfresco/api/-default-/public/alfresco/versions/1
content.service.security.basicAuth.username=admin
content.service.security.basicAuth.password=admin

# --- Propiedades propias del curso ---
curso.startup-check.enabled=true
curso.tag-pdf=pdf

# --- Leccion 11: procesamiento asincrono y reconciliacion ---
curso.classifier.max-bytes=1000000
curso.reconciliation.enabled=true
curso.reconciliation.checkpoint-file=./checkpoint.txt
curso.reconciliation.margin=5m
spring.task.execution.thread-name-prefix=curso-async-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
# Al parar la app, esperar a que terminen las tareas en curso
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

# --- Leccion 12: modelo de contenido propio ---
curso.model-bootstrap.enabled=true
curso.factura.umbral-aprobacion=1000

logging.level.com.curso.alfresco=DEBUG
